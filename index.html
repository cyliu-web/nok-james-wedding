:root{
  --cream:#FBECDB;--paper:#FFF8F0;
  --peach-3:#EEB899;--apricot:#E8996C;
  --sage-1:#AFB2A1;--sage-2:#798571;
  --ink:#74613D;--brown:#94512E;
  --script:'Parisienne','Snell Roundhand','Apple Chancery',cursive;
  --sans:'Josefin Sans','Noto Sans Thai','Thonburi','Leelawadee UI','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --ew:340px;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .30 0 0 0 0 .2 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(55% 40% at 8% 6%,rgba(238,184,153,.42),transparent 70%),
    radial-gradient(50% 36% at 96% 14%,rgba(175,178,161,.36),transparent 70%),
    radial-gradient(60% 42% at 90% 96%,rgba(238,184,153,.40),transparent 70%),
    radial-gradient(55% 40% at 4% 92%,rgba(175,178,161,.32),transparent 70%),
    var(--cream)}
#bg::after{content:'';position:absolute;inset:0;background:var(--noise);opacity:.2;mix-blend-mode:multiply}
.fl{position:absolute;height:min(36vh,calc(50vw / 1.193));aspect-ratio:500/419;background-image:var(--liner);background-size:200% 100%;background-repeat:no-repeat;opacity:.5}
.fl.tl{top:0;left:0;background-position:0 0;-webkit-mask-image:radial-gradient(130% 125% at 0 0,#000 50%,transparent 78%);mask-image:radial-gradient(130% 125% at 0 0,#000 50%,transparent 78%)}
.fl.tr{top:0;right:0;background-position:100% 0;-webkit-mask-image:radial-gradient(130% 125% at 100% 0,#000 50%,transparent 78%);mask-image:radial-gradient(130% 125% at 100% 0,#000 50%,transparent 78%)}
.fl.bl{bottom:0;left:0;background-position:100% 0;transform:rotate(180deg);-webkit-mask-image:radial-gradient(130% 125% at 100% 0,#000 50%,transparent 78%);mask-image:radial-gradient(130% 125% at 100% 0,#000 50%,transparent 78%)}
.fl.br{bottom:0;right:0;background-position:0 0;transform:rotate(180deg);-webkit-mask-image:radial-gradient(130% 125% at 0 0,#000 50%,transparent 78%);mask-image:radial-gradient(130% 125% at 0 0,#000 50%,transparent 78%)}

/* ---------- intro scene ---------- */
#scene{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;cursor:pointer}
.is-open #scene{cursor:default}
.intro-text{text-align:center;opacity:0}
.lead{font-family:var(--script);font-size:clamp(30px,calc(var(--ew)*.11),46px);color:var(--brown);line-height:1.15}
.sub{font-size:12.5px;letter-spacing:.16em;margin-top:4px;opacity:.72}
#introTop{margin-bottom:calc(var(--ew)*.1)}
#introBot{margin-top:calc(var(--ew)*.13)}
.hint{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.hint b{font-weight:600;font-size:12.5px;letter-spacing:.32em;text-transform:uppercase;padding-left:.32em;animation:pulse 2.2s ease-in-out infinite}
.hint small{font-size:12px;letter-spacing:.12em;opacity:.72}
.tapdot{position:relative;width:26px;height:26px;margin-bottom:2px}
.tapdot::before,.tapdot::after{content:'';position:absolute;inset:0;border-radius:50%}
.tapdot::before{inset:8px;background:var(--apricot);opacity:.8}
.tapdot::after{border:1.5px solid var(--apricot);animation:ripple 2.2s ease-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes ripple{0%{transform:scale(.45);opacity:.9}80%,100%{transform:scale(1.35);opacity:0}}

#stage{position:relative;flex:none;width:var(--ew);height:calc(var(--ew) / 1.4);perspective:calc(var(--ew) * 3.2)}
#drop{position:absolute;inset:0;opacity:0}
#bob,#env{position:absolute;inset:0}
#env{outline:none;border-radius:3px}
#env:focus-visible{box-shadow:0 0 0 3px rgba(232,153,108,.6)}
.eshadow{position:absolute;left:5%;right:5%;bottom:-12%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,70,40,.28),rgba(120,70,40,0))}
.face{position:absolute;inset:0}

/* front (address side) */
.front{border-radius:3px;overflow:hidden;
  background:linear-gradient(160deg,#FADFCC 0%,#F5CBB0 52%,#F0BEA1 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 calc(var(--ew)*.025) calc(var(--ew)*.06) rgba(120,70,40,.16),0 1px 3px rgba(120,70,40,.12)}
.front::before{content:'';position:absolute;inset:0;background:var(--noise);opacity:.32;mix-blend-mode:multiply}
.front::after{content:'';position:absolute;inset:4.5%;border:1px solid rgba(255,255,255,.55);border-radius:2px}
.stamp{position:absolute;top:9%;right:6.5%;width:23%;padding:calc(var(--ew)*.011);z-index:1;transform:rotate(4deg);
  --t:calc(var(--ew)*.0185);
  background:radial-gradient(circle at center,transparent 28%,#FFFAF3 31%);
  background-size:var(--t) var(--t);background-position:calc(var(--t) / -2) calc(var(--t) / -2);
  filter:drop-shadow(0 1px 1.2px rgba(110,60,30,.3))}
.stamp img{display:block;width:100%;aspect-ratio:480/383;object-fit:cover}
.stamp-val{position:absolute;left:calc(var(--ew)*.021);bottom:calc(var(--ew)*.017);font-size:calc(var(--ew)*.021);font-weight:600;letter-spacing:.2em;color:#fff;text-shadow:0 1px 2px rgba(80,50,30,.55)}
.postmark{position:absolute;left:34%;top:16%;width:50%;z-index:2;color:var(--brown);opacity:0;mix-blend-mode:multiply;transform:rotate(-14deg);transform-origin:76% 50%}
.addr{position:absolute;left:6%;right:6%;top:64%;transform:translateY(-50%);text-align:center;z-index:1}
.caps{font-size:calc(var(--ew)*.027);letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;opacity:.85}
.names{font-family:var(--script);font-size:calc(var(--ew)*.128);line-height:1.08;margin:calc(var(--ew)*.008) 0 calc(var(--ew)*.004)}
.names .amp{color:var(--apricot)}
.date::before,.date::after{content:'';display:inline-block;vertical-align:middle;width:calc(var(--ew)*.06);height:1px;background:currentColor;opacity:.45;margin:0 calc(var(--ew)*.018) .25em}

/* back (flap side) */
.back{display:none;perspective:calc(var(--ew) * 2.2);perspective-origin:50% 45%}
.back.on{display:block}
.inside{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(105,58,34,.34),rgba(105,58,34,.10) 45%,rgba(105,58,34,0) 70%),var(--liner) center top / 100% auto no-repeat,var(--cream);
  box-shadow:0 calc(var(--ew)*.025) calc(var(--ew)*.06) rgba(120,70,40,.16),0 1px 3px rgba(120,70,40,.12)}
.card-in{position:absolute;z-index:3;width:calc(var(--ew)*.62);height:calc(var(--ew)*.93);left:calc(var(--ew)*.19);top:calc(var(--ew) / 2.8 - var(--ew)*.465);transform:rotate(-90deg);--w:calc(var(--ew)*.62)}
.pocket{position:absolute;inset:0;z-index:4;width:100%;height:100%;overflow:visible}
.pnoise{position:absolute;inset:0;z-index:4;pointer-events:none;background:var(--noise);opacity:.3;mix-blend-mode:multiply;-webkit-clip-path:polygon(0 0,44.07% 45.8%,50% 42.9%,55.93% 45.8%,100% 0,100% 100%,0 100%);clip-path:polygon(0 0,44.07% 45.8%,50% 42.9%,55.93% 45.8%,100% 0,100% 100%,0 100%)}
.fnoise{position:absolute;inset:0;background:var(--noise);opacity:.3;mix-blend-mode:multiply;-webkit-clip-path:polygon(0 0,100% 0,56.43% 85.83%,50% 92.1%,43.57% 85.83%);clip-path:polygon(0 0,100% 0,56.43% 85.83%,50% 92.1%,43.57% 85.83%)}
.flap.open .fnoise{display:none}
.flap{position:absolute;left:0;top:0;width:100%;height:60%;z-index:5;transform-origin:50% 0}
.flap.open{z-index:2}
.flap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flap-in{visibility:hidden}
.flap.open .flap-out{visibility:hidden}
.flap.open .flap-in{visibility:visible}
.seal{position:absolute;z-index:6;width:19%;aspect-ratio:1;left:40.5%;top:38.7%;filter:drop-shadow(0 calc(var(--ew)*.006) calc(var(--ew)*.008) rgba(50,35,20,.38))}
.seal .half{position:absolute;inset:0}
.seal svg{display:block;width:100%;height:100%}
.half.l{-webkit-clip-path:polygon(0 0,52% 0,47% 18%,55% 33%,46% 50%,54% 67%,47% 84%,51% 100%,0 100%);clip-path:polygon(0 0,52% 0,47% 18%,55% 33%,46% 50%,54% 67%,47% 84%,51% 100%,0 100%)}
.half.r{-webkit-clip-path:polygon(52% 0,100% 0,100% 100%,51% 100%,47% 84%,54% 67%,46% 50%,55% 33%,47% 18%);clip-path:polygon(52% 0,100% 0,100% 100%,51% 100%,47% 84%,54% 67%,46% 50%,55% 33%,47% 18%)}

/* card back (shared by the card inside the envelope and the flipping card) */
.cardback{position:absolute;inset:0;border-radius:calc(var(--w)*.022);overflow:hidden;
  background:var(--liner) center top / 100% auto no-repeat,var(--paper);box-shadow:0 1px 3px rgba(110,70,40,.2)}
.cardback::before{content:'';position:absolute;inset:calc(var(--w)*.05);border:1px solid rgba(232,153,108,.5);border-radius:calc(var(--w)*.012)}
.cardback::after{content:'';position:absolute;inset:0;background:var(--noise);opacity:.16;mix-blend-mode:multiply}
.cb-mono{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;font-family:var(--script);font-size:calc(var(--w)*.21);color:var(--apricot);line-height:1}
.cb-date{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:calc(var(--w)*.042);letter-spacing:.38em;padding-left:.38em;color:var(--ink);opacity:.8}

/* ---------- revealed card ---------- */
#revealLayer{position:fixed;inset:0;z-index:20;pointer-events:none;perspective:2200px;display:none}
#revealLayer.on{display:block}
#reveal{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
.r-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:calc(var(--w)*.018);overflow:hidden;
  box-shadow:0 calc(var(--w)*.05) calc(var(--w)*.12) rgba(110,60,30,.22),0 2px 6px rgba(110,60,30,.14)}
.r-back{transform:rotateY(180deg)}
.r-front img{display:block;width:100%;height:100%}

#petalsF{position:fixed;inset:0;z-index:30;pointer-events:none}
#petalsB{position:fixed;inset:0;z-index:15;pointer-events:none}

/* ---------- after reveal ---------- */
#after{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:6px 14px 20px;text-align:center;visibility:hidden;opacity:0}
#after.on{visibility:visible}
.count{font-family:var(--script);color:var(--brown);font-size:28px;line-height:1.1}
.count .n{font-size:40px;margin-right:7px}
.count-sub{font-size:11.5px;letter-spacing:.12em;opacity:.72;margin-top:1px}
.actions{position:relative;display:flex;justify-content:center;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:9px 16px 9px 13px;border-radius:999px;background:rgba(255,249,242,.9);border:1px solid rgba(232,153,108,.5);color:var(--ink);text-decoration:none;cursor:pointer;box-shadow:0 3px 10px rgba(120,70,40,.08);transition:transform .15s,background .2s}
.btn:hover{background:#fff}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px;flex:none;color:var(--apricot)}
.btn .t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;text-align:left}
.btn b{font-weight:600;font-size:13px;letter-spacing:.08em}
.btn small{font-size:10.5px;opacity:.72;letter-spacing:.03em;white-space:nowrap}
.calwrap{position:relative}
.calmenu [hidden]{display:none}
.calmenu small{display:block;font-size:11px;opacity:.7;margin-top:3px;white-space:nowrap;letter-spacing:.03em}
.calmenu{position:absolute;bottom:calc(100% + 10px);right:0;background:#FFF9F2;border:1px solid rgba(232,153,108,.45);border-radius:14px;box-shadow:0 10px 30px rgba(110,60,30,.18);padding:6px;min-width:230px;display:flex;flex-direction:column;z-index:2}
.calmenu[hidden]{display:none}
.calmenu a,.calmenu button{display:block;padding:10px 12px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:13.5px;letter-spacing:.04em;text-align:left;background:none;border:0;cursor:pointer}
.calmenu a:hover,.calmenu button:hover{background:rgba(238,184,153,.22)}
.corner{position:fixed;top:12px;z-index:40;height:36px;min-width:36px;padding:0 12px 0 10px;border-radius:999px;border:1px solid rgba(232,153,108,.45);background:rgba(255,249,242,.82);color:var(--brown);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.corner svg{width:17px;height:17px;flex:none}
#soundBtn{right:12px;padding:0}
#soundBtn .x{display:none}
#soundBtn.muted .w{display:none}
#soundBtn.muted .x{display:inline}
#replayBtn{left:12px;opacity:0;pointer-events:none;transition:opacity .5s}
#replayBtn.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:rgba(116,97,61,.94);color:#fff;padding:8px 16px;border-radius:999px;font-size:12.5px;letter-spacing:.06em;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}

/* reduced motion: no choreography, just a gentle fade */
.rm #drop,.rm .intro-text{opacity:1}
.rm .postmark{opacity:.62}
.rm .hint b,.rm .tapdot::after{animation:none}
</style>
</head>

function sealSVG(){
  let d='';
  const N=90;
  for(let i=0;i<=N;i++){
    const t=i/N*Math.PI*2;
    const r=45+1.7*Math.sin(5*t+.5)+1.1*Math.sin(9*t+1.3)+.7*Math.sin(14*t+2.1);
    d+=(i?'L':'M')+(r*Math.cos(t)).toFixed(2)+','+(r*Math.sin(t)).toFixed(2);
  }
  return `<svg viewBox="-50 -50 100 100" aria-hidden="true">
    <defs>
      <radialGradient id="wax" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#A6B19A"/><stop offset=".45" stop-color="#7F8C75"/><stop offset="1" stop-color="#56624D"/></radialGradient>
      <radialGradient id="waxIn" cx="62%" cy="66%" r="72%"><stop offset="0" stop-color="#8C9881"/><stop offset="1" stop-color="#697560"/></radialGradient>
    </defs>
    <path d="${d}Z" fill="url(#wax)"/>
    <circle r="31" fill="url(#waxIn)"/>
    <circle r="31" fill="none" stroke="#525D4A" stroke-width="2.4" opacity=".7"/>
    <circle r="33.3" fill="none" stroke="#C3CBB6" stroke-width="1.1" opacity=".55"/>
    <g font-family="Parisienne, cursive" font-size="26" text-anchor="middle">
      <text x="-.7" y="7.6" fill="#47513F" opacity=".75">N&amp;J</text>
      <text x=".8" y="9.1" fill="#CDD5C1" opacity=".6">N&amp;J</text>
      <text x="0" y="8.4" fill="#6A765E" stroke="#6A765E" stroke-width=".6">N&amp;J</text>
    </g>
    <ellipse cx="-17" cy="-21" rx="14" ry="6.5" fill="#fff" opacity=".2" transform="rotate(-32 -17 -21)"/>
  </svg>`;
}

let EW=340;
function layout(){
  const vw=innerWidth,vh=innerHeight;
  EW=Math.round(Math.max(220,Math.min(vw*.86,520,vh*.42*1.4)));
  root.style.setProperty('--ew',EW+'px');
}
function finalRect(){
  const vw=innerWidth,vh=innerHeight,ah=after.offsetHeight||150,top=14,gap=8;
  const avail=vh-ah-top-gap;
  const h=Math.max(220,Math.min(avail,(vw-28)*1.5,1080));
  const w=h/1.5;
  return {w,h,x:(vw-w)/2,y:top+Math.max(0,(avail-h)/2)};
}
function placeReveal(F){

function fillCountdown(){
  const day=t=>Math.floor((t+7*3600e3)/864e5); // calendar days in Thailand
  const n=day(START)-day(Date.now());
  const c=$('#count'),s=$('#countSub');
  if(n>1){c.innerHTML=`<span class="n">${n}</span>days to go`;s.textContent=`倒數 ${n} 天 · อีก ${n} วัน`;}
  else if(n===1){c.innerHTML='<span class="n">1</span>day to go';s.textContent='明天見 · พรุ่งนี้แล้ว';}
  else if(n===0){c.textContent='Today is the day!';s.textContent='就是今天 · วันนี้แล้ว';}
  else{c.textContent='Thank you for celebrating with us';s.textContent='謝謝你的祝福 · ขอบคุณที่มาร่วมยินดี';}
}

/* ---------- sound (synthesised, starts on the first tap) ---------- */
let ac=null,master=null,muted=false,nbuf=null;
function initAudio(){
  try{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.9;master.connect(ac.destination);}
    if(ac.state==='suspended') ac.resume().catch(()=>{});
  }catch(e){ac=null;}
}
function noise(){
  if(nbuf) return nbuf;
  nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return nbuf;
}
function env1(g,t,peak,a,dcy){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dcy);}
function sfx(kind){
  if(!ac||muted) return;
  try{
    const t=ac.currentTime+.01;
    if(kind==='crack'){
      const s=ac.createBufferSource();s.buffer=noise();
      const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2300;f.Q.value=1.1;
      const g=ac.createGain();env1(g,t,.45,.003,.08);
      s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+.12);
      const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(60,t+.12);
      const g2=ac.createGain();env1(g2,t,.3,.004,.15);o.connect(g2).connect(master);o.start(t);o.stop(t+.2);
    }else if(kind==='chime'){
      [1318.5,1661.2,1975.5,2637].forEach((f,i)=>{
        const st=t+i*.11;
        [[1,.11,1.7],[2.76,.022,.45]].forEach(([m,amp,dcy])=>{
          const o=ac.createOscillator();o.type='sine';o.frequency.value=f*m;
          const g=ac.createGain();env1(g,st,amp,.006,dcy);o.connect(g).connect(master);o.start(st);o.stop(st+dcy+.1);
        });
      });
    }else{ // paper sounds: flip / flap / slide
      const dur={flip:.32,flap:.45,slide:.85}[kind]||.4, peak={flip:.12,flap:.13,slide:.08}[kind]||.1;
      const s=ac.createBufferSource();s.buffer=noise();s.loop=true;
      const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=.8;
      f.frequency.setValueAtTime(kind==='slide'?900:1300,t);f.frequency.linearRampToValueAtTime(kind==='slide'?2400:3200,t+dur);
      const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+dur*.35);g.gain.linearRampToValueAtTime(.0001,t+dur);
      s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur+.05);
    }
  }catch(e){}
}

/* ---------- petals ---------- */
function makePetals(sel){
  const cv=$(sel),ctx=cv.getContext('2d');
  let W=0,H=0,list=[],running=false,ambient=0,last=0;
  const COLORS=[['#F3BCA2','#FCE4D6'],['#EDA587','#F9D3C0'],['#F5C6AC','#FCE3D3'],['#E8996C','#F6C6A8']];
  const LEAF=['#98A88F','#C6D0BB'];
  function resize(){const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
  function make(x,y,burst){
    const leaf=Math.random()<.16, s=(leaf?6:5.5)+Math.random()*6.5, c=leaf?LEAF:COLORS[(Math.random()*COLORS.length)|0];
    const g=ctx.createLinearGradient(0,-s,0,s);g.addColorStop(0,c[1]);g.addColorStop(1,c[0]);
    const p={x,y,s,leaf,g,rot:Math.random()*6.28,vr:(Math.random()-.5)*.05,flip:Math.random()*6.28,vf:.03+Math.random()*.05,
      sway:Math.random()*6.28,amp:.35+Math.random()*.8,spd:.012+Math.random()*.02,vx:0,vy:.45+Math.random()*.7,burst,age:0};
    if(burst){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.35,sp=4+Math.random()*7.5;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;}
    return p;
  }
  function draw(p,alpha){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(Math.max(.15,Math.abs(Math.cos(p.flip))),1);
    ctx.fillStyle=p.g;ctx.globalAlpha=alpha;ctx.beginPath();const s=p.s;
    if(p.leaf){ctx.moveTo(0,-s*1.25);ctx.quadraticCurveTo(s*.6,0,0,s*1.25);ctx.quadraticCurveTo(-s*.6,0,0,-s*1.25);}
    else{ctx.moveTo(0,-s*.85);ctx.bezierCurveTo(s*.5,-s*1.15,s*1.05,-s*.4,s*.7,s*.35);ctx.bezierCurveTo(s*.45,s*.85,-s*.45,s*.85,-s*.7,s*.35);ctx.bezierCurveTo(-s*1.05,-s*.4,-s*.5,-s*1.15,0,-s*.85);}
    ctx.fill();ctx.restore();
  }
  function step(now){
    if(!running) return;
    const dt=Math.min(2.5,(now-last)/16.67||1);last=now;
    ctx.clearRect(0,0,W,H);
    if(ambient){let n=0;for(const p of list) if(!p.burst) n++; if(n<ambient&&Math.random()<.05*dt) list.push(make(Math.random()*W,-20,false));}
    for(let i=list.length-1;i>=0;i--){
      const p=list[i];
      if(p.burst){p.vx*=Math.pow(.95,dt);p.vy=p.vy*Math.pow(.95,dt)+.12*dt;if(p.vy>1.3)p.vy=1.3;}
      p.sway+=p.spd*dt;p.x+=(p.vx+Math.sin(p.sway)*p.amp)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.flip+=p.vf*dt;
      if(p.y>H+30||p.x<-50||p.x>W+50){list.splice(i,1);continue;}
      p.age+=dt*16.67;
      let alpha=.92;
      if(p.burst&&p.age>2600){alpha=.92*(1-(p.age-2600)/1400);if(alpha<=0){list.splice(i,1);continue;}}
      draw(p,alpha);
    }
    if(!list.length&&!ambient){running=false;ctx.clearRect(0,0,W,H);return;}
    requestAnimationFrame(step);
  }
  function go(){if(!running){running=true;last=performance.now();requestAnimationFrame(step);}}
  return{resize,burst(x,y,n){for(let i=0;i<n;i++)list.push(make(x,y,true));go();},ambient(n){ambient=n;go();},stop(){ambient=0;list=[];ctx.clearRect(0,0,W,H);}};
}
const petalsF=makePetals('#petalsF'), petalsB=makePetals('#petalsB'); // burst in front of the card, gentle fall behind it
const petals={resize(){petalsF.resize();petalsB.resize();},stop(){petalsF.stop();petalsB.stop();}};

/* ---------- choreography ---------- */
let state='intro',token=0,bobAnim=null,ready=false,pending=false;
function fade(el,from,to,dur,delay=0){anim(el,[{opacity:from},{opacity:to}],{duration:dur,delay,fill:'forwards',easing:'ease'});}

function intro(){
  const my=++token; state='intro'; root.classList.remove('is-open');
  ready=false; pending=false;
  if(reduce){ready=true;return;}
  setTimeout(()=>{if(my!==token) return; ready=true; if(pending) open();},1600);
  anim(drop,[
    {transform:'translateY(-70vh) rotate(-12deg)',opacity:0,easing:'cubic-bezier(.2,.6,.4,1)'},
    {transform:'translateY(-4vh) rotate(5deg)',opacity:1,offset:.55,easing:'cubic-bezier(.4,0,.4,1)'},
    {transform:'translateY(1.2vh) rotate(-2deg)',opacity:1,offset:.8,easing:'cubic-bezier(.3,0,.3,1)'},
    {transform:'translateY(0) rotate(0deg)',opacity:1}
  ],{duration:1600,fill:'both'});
  fade(introTop,0,1,800,700);
  fade(introBot,0,1,800,1500);
  setTimeout(()=>{if(my===token&&state==='intro') thunk();},1700);
  setTimeout(()=>{if(my===token&&state==='intro') startBob();},2150);
}
function thunk(){
  anim(postmark,[{transform:'rotate(-26deg) scale(1.9)',opacity:0},{transform:'rotate(-14deg) scale(1)',opacity:.62}],{duration:210,easing:'cubic-bezier(.6,0,1,.5)',fill:'forwards'});
  setTimeout(()=>anim(env,[{transform:'none'},{transform:'translateY(2.5px) scale(.995)'},{transform:'none'}],{duration:200,easing:'ease-out'}),200);
}
function startBob(){
  bobAnim=anim(bob,[{transform:'translateY(0) rotate(0deg)'},{transform:'translateY(-5px) rotate(-.6deg)'},{transform:'translateY(0) rotate(0deg)'}],{duration:3400,iterations:Infinity,easing:'ease-in-out'});
}
function settleBob(){
  if(!bobAnim) return;
  const cur=getComputedStyle(bob).transform;
  bobAnim.cancel();bobAnim=null;
  if(cur&&cur!=='none') anim(bob,[{transform:cur},{transform:'none'}],{duration:260,easing:'ease-out'});
}

async function open(){
  if(state!=='intro') return;
  if(!ready){pending=true;return;} // tapped while the letter is still landing: open as soon as it lands
  state='opening'; root.classList.add('is-open');
  const my=token;
  initAudio(); settleBob();
  fade(introTop,getComputedStyle(introTop).opacity,0,350);
  fade(introBot,getComputedStyle(introBot).opacity,0,300);
  try{
    if(reduce) return await quickReveal(my);
    const K=EW;
    // 1 · flip the envelope over
    sfx('flip');
    await anim(env,[{transform:'rotateY(0deg) scale(1)'},{transform:'rotateY(90deg) scale(1.04)'}],{duration:340,easing:'cubic-bezier(.5,0,.9,.6)',fill:'forwards'}).finished;
    front.style.display='none'; back.classList.add('on');
    await anim(env,[{transform:'rotateY(-90deg) scale(1.04)'},{transform:'rotateY(0deg) scale(1)'}],{duration:440,easing:'cubic-bezier(.15,.55,.3,1)',fill:'forwards'}).finished;
    if(my!==token) return;
    await wait(260);
    // 2 · break the wax seal
    await anim(seal,[{transform:'rotate(0)'},{transform:'rotate(-5deg)'},{transform:'rotate(4deg)'},{transform:'rotate(0)'}],{duration:260,easing:'ease-in-out'}).finished;
    sfx('crack');
    const crack={duration:900,easing:'cubic-bezier(.35,0,.65,1)',fill:'forwards'};
    anim(halfL,[{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${-K*.035}px,${K*.01}px) rotate(-14deg)`,opacity:1,offset:.28},{transform:`translate(${-K*.09}px,${K*.32}px) rotate(-55deg)`,opacity:0}],crack);
    anim(halfR,[{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${K*.035}px,${K*.01}px) rotate(14deg)`,opacity:1,offset:.28},{transform:`translate(${K*.09}px,${K*.34}px) rotate(48deg)`,opacity:0}],crack);
    await wait(300);
    if(my!==token) return;
    // 3 · lift the flap
    sfx('flap');
    await anim(flap,[{transform:'rotateX(0deg)'},{transform:'rotateX(90deg)'}],{duration:380,easing:'cubic-bezier(.45,0,.85,.55)',fill:'forwards'}).finished;
    flap.classList.add('open');
    await anim(flap,[{transform:'rotateX(90deg)'},{transform:'rotateX(180deg)'}],{duration:460,easing:'cubic-bezier(.15,.5,.35,1)',fill:'forwards'}).finished;
    if(my!==token) return;
    await wait(120);
    // 4 · draw the card out while the envelope sinks
    sfx('slide');
    const ease='cubic-bezier(.45,0,.2,1)';
    anim(stage,[{transform:'translateY(0)'},{transform:`translateY(${K*.3}px)`}],{duration:1050,easing:ease,fill:'forwards'});
    await anim(cardIn,[{transform:'translateY(0) rotate(-90deg)'},{transform:`translateY(${-K*.69}px) rotate(-90deg)`}],{duration:1050,easing:ease,fill:'forwards'}).finished;
    if(my!==token) return;
    await wait(140);
    // 5 · the card turns upright, flips to its face and grows to full size
    await revealCard(my);
  }catch(e){ /* interrupted by replay */ }
}

function revealCard(my){
  const r=cardIn.getBoundingClientRect();
  const F=finalRect(); placeReveal(F);
  const s0=r.height/F.w, dx=r.left+r.width/2-(F.x+F.w/2), dy=r.top+r.height/2-(F.y+F.h/2);
  layer.classList.add('on'); cardIn.style.visibility='hidden';
  sfx('chime');
  const a=anim(rev,[
    {transform:`translate(${dx}px,${dy}px) rotate(-90deg) rotateY(180deg) scale(${s0})`},
    {transform:'translate(0px,0px) rotate(0deg) rotateY(0deg) scale(1)'}
  ],{duration:1500,easing:'cubic-bezier(.32,.08,.18,1)',fill:'forwards'});
  const sunk=EW*.3;
  anim(stage,[{transform:`translateY(${sunk}px)`,opacity:1},{transform:`translateY(${sunk+innerHeight*.75}px)`,opacity:0}],{duration:1050,easing:'cubic-bezier(.55,0,.8,.3)',fill:'forwards'});
  document.querySelectorAll('.fl').forEach(f=>anim(f,[{opacity:.5},{opacity:.3}],{duration:1200,fill:'forwards'}));
  setTimeout(()=>{if(my===token) petalsF.burst(F.x+F.w/2,F.y+F.h*.32,44);},620);
  return a.finished.then(()=>{if(my!==token) return; showAfter(); state='revealed'; petalsB.ambient(16);});
}

async function quickReveal(my){
  anim(stage,[{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});
  const F=finalRect(); placeReveal(F); layer.classList.add('on');
  await anim(rev,[{opacity:0},{opacity:1}],{duration:500,fill:'forwards'}).finished;
  if(my!==token) return;
  showAfter(); state='revealed';
}

function showAfter(){
  after.classList.add('on');
  anim(after,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:650,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});
  replayBtn.classList.add('on');
}

function reset(){
  token++;
  live.forEach(a=>{try{a.cancel();}catch(e){}}); live.clear(); bobAnim=null;
  front.style.display=''; back.classList.remove('on'); flap.classList.remove('open');
  cardIn.style.visibility=''; layer.classList.remove('on'); after.classList.remove('on'); replayBtn.classList.remove('on');
  closeMenu(); petals.stop(); fillCountdown(); layout();
  intro();
}

async function copyText(text){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}}catch(e){}
  try{ // fallback for in-app browsers (e.g. LINE) and older phones
    const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0;-webkit-user-select:text;user-select:text';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    const ok=document.execCommand('copy');ta.remove();return ok;
  }catch(e){return false;}
}
soundBtn.addEventListener('click',e=>{
